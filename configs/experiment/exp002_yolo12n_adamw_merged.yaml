description: "YOLO12n, AdamW, imgsz=1024, lr0=0.0014 (train+valid 合併訓練，僅評估 test)"

model: model/yolo12n.yaml

merge_val_to_train: true

train:
  epochs:        80
  batch_size:    16
  learning_rate: 0.0014
  optimizer:     AdamW
  patience:      15
  img_size:      1024
  device:        "0,1"
  seed:          0
  workers:       4
