name: yolo12n_cutout_aug_cv5
description: "Official CV: YOLOv12n raw images with DENTEX-inspired random erasing as a cutout proxy."
protocol: configs/protocol/cv5_locked_test.yaml
engine: yolo
model: model/yolo12n.yaml
dataset_variant: raw

train:
  epochs: 80
  batch_size: 16
  learning_rate: 0.000676
  optimizer: AdamW
  patience: 25
  img_size: 1024
  device: "0"
  seed: 20260525
  workers: 2
  plots: false
  erasing: 0.6

evaluation:
  iou_threshold: 0.5
  conf_mode: auto
  predict_conf: 0.001
  nms_iou: 0.45
  max_det: 300
