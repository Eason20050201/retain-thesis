name: yolo12n_conservative_roi_cv5
description: "Round 3: YOLOv12n with conservative ROI crop that removes only outer black/background margins."
protocol: configs/protocol/cv5_locked_test.yaml
engine: yolo
model: model/yolo12n.yaml
dataset_variant: conservative_roi

train:
  epochs: 80
  batch_size: 16
  learning_rate: 0.000676
  optimizer: AdamW
  patience: 25
  img_size: 1024
  device: "0"
  seed: 20260525
  workers: 2
  plots: false

evaluation:
  iou_threshold: 0.5
  conf_mode: auto
  predict_conf: 0.001
  nms_iou: 0.45
  max_det: 300
