image:
  size: [1024, 1024]     # resize 目標尺寸 [H, W]（未接入主流程，ultralytics 自行處理）
  normalize: true
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
  grayscale: false       # 全口 X 光通常保留單通道，false 則轉 3 通道

augmentation:
  enabled: true
  horizontal_flip: 0.5
  vertical_flip: 0.0
  random_brightness_contrast:
    p: 0.3
    brightness_limit: 0.2
    contrast_limit: 0.2
  clahe:                 # 對比度增強，適合 X 光影像
    p: 0.4
    clip_limit: 4.0
    tile_grid_size: [8, 8]
  gaussian_noise:
    p: 0.2
    var_limit: [10, 50]
  rotate:
    p: 0.3
    limit: 10

split:
  train_ratio: 0.8
  val_ratio:   0.1
  test_ratio:  0.1
  seed: 42
  stratify: true         # 依類別分層抽樣

output_dir: data/processed
splits_dir: data/splits
