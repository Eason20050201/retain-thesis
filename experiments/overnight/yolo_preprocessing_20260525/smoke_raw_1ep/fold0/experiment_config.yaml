name: smoke_raw_1ep
description: "Overnight smoke test: YOLOv12n raw fold0, 1 epoch only."
protocol: configs/protocol/cv5_locked_test.yaml
output_root: experiments/overnight/yolo_preprocessing_20260525
engine: yolo
model: model/yolo12n.yaml
dataset_variant: raw

train:
  epochs: 1
  batch_size: 16
  learning_rate: 0.000676
  optimizer: AdamW
  patience: 1
