name: yolo12n_affine_aug_fold0
description: "Overnight screening: YOLOv12n raw images with small affine augmentation on fold0."
protocol: configs/protocol/cv5_locked_test.yaml
output_root: experiments/overnight/yolo_preprocessing_20260525
engine: yolo
model: model/yolo12n.yaml
dataset_variant: raw

train:
  epochs: 50
  batch_size: 16
  learning_rate: 0.000676
  optimizer: AdamW
  patience: 15
  img_size: 1024
  device: "0"
  seed: 20260525
  workers: 2
  plots: false
  degrees: 5.0
  translate: 0.12
  scale: 0.4
  shear: 2.0
  perspective: 0.0

evaluation:
  iou_threshold: 0.5
  conf_mode: auto
  predict_conf: 0.001
  nms_iou: 0.45
  max_det: 300
