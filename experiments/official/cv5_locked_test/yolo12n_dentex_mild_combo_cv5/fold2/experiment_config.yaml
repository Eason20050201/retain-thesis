name: yolo12n_dentex_mild_combo_cv5
description: "Official CV: YOLOv12n raw images with mild DENTEX-style photometric, affine, and cutout augmentation."
protocol: configs/protocol/cv5_locked_test.yaml
engine: yolo
model: model/yolo12n.yaml
dataset_variant: raw

train:
  epochs: 80
  batch_size: 16
  learning_rate: 0.000676
  optimizer: AdamW
  patience: 25
  img_size: 1024
  device: "0"
  seed: 20260525
  workers: 2
  plots: false
  hsv_h: 0.0
  hsv_s: 0.1
  hsv_v: 0.35
  degrees: 3.0
  translate: 0.08
  scale: 0.25
  shear: 1.0
  perspective: 0.0
  erasing: 0.2

evaluation:
  iou_threshold: 0.5
  conf_mode: auto
  predict_conf: 0.001
  nms_iou: 0.45
  max_det: 300
